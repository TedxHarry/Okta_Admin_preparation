site_name: Okta Administrator preparation
site_url: https://tedxharry.github.io/Okta_Admin_preparation/
docs_dir: .site_docs
theme:
  name: material
  language: en
  icon:
    logo: material/shield-key-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: luxury-light
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: luxury-dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false

plugins:
  - search


markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path:
        - includes/manage-users
        - includes/manage-groups
        - includes/manage-profiles
        - includes/active-directory
        - includes/behavior-detection
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true
extra_css:
  - assets/stylesheets/luxury.css
  - assets/stylesheets/readability-v3.css
  - assets/stylesheets/lab-tiles.css
  - assets/stylesheets/manage-users-lab-grid.css
  - assets/stylesheets/course-sidebar.css
  - assets/stylesheets/course-term-help.css
extra_javascript:
  - assets/javascripts/course-sidebar.js
  - assets/javascripts/course-term-help.js
  - assets/javascripts/group-rule-explorer.js
