site_name: Okta Administrator preparation
site_url: https://tedxharry.github.io/Okta_Admin_preparation/
docs_dir: .site_docs
theme:
  name: material
  language: en
  icon:
    logo: material/shield-key-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: luxury-light
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: luxury-dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false

plugins:
  - search


markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true
extra_css:
  - assets/stylesheets/luxury.css
  - assets/stylesheets/readability-v3.css
nav:
  - Course outline: index.md
  - Exam coverage: exam/coverage.md
  - Week 1 · Foundations:
      - Lesson 1 · Your Okta org: week-01-foundations/lessons/01-your-okta-org.md
      - Lesson 2 · Users, profiles, and activation: week-01-foundations/lessons/02-users-profiles-and-activation.md
      - Lesson 3 · Groups and membership rules: week-01-foundations/lessons/03-groups-and-membership-rules.md
      - Lesson 4 · Application assignment and the End-User Dashboard: week-01-foundations/lessons/04-application-assignment-and-dashboard.md
      - Lesson 5 · System Log and access investigations: week-01-foundations/lessons/05-system-log-and-access-investigations.md
      - Week 1 capstone · Finance joiner and mover: week-01-foundations/labs/06-finance-joiner-and-mover.md
  - Week 2 · Universal Directory and lifecycle:
      - Lesson 1 · Universal Directory and profile attributes: week-02-directory-and-lifecycle/lessons/01-universal-directory-and-profile-attributes.md
      - Lesson 2 · Profile mappings: week-02-directory-and-lifecycle/lessons/02-profile-mappings.md
      - Lesson 3 · Suspend, deactivate, and restore a user: week-02-directory-and-lifecycle/lessons/03-user-account-lifecycle.md
      - Lesson 4 · Profile sourcing and source priority: week-02-directory-and-lifecycle/lessons/04-profile-sourcing-and-source-priority.md
      - Lesson 5 · Application provisioning: week-02-directory-and-lifecycle/lessons/05-application-provisioning.md
      - Lesson 6 · Group Push: week-02-directory-and-lifecycle/lessons/06-group-push.md
