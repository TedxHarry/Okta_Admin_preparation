site_name: Okta Administrator preparation
site_url: https://tedxharry.github.io/Okta_Admin_preparation/
docs_dir: .site_docs
theme:
  name: material
  language: en
  icon:
    logo: material/shield-key-outline
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: luxury-light
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: luxury-dark
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false

plugins:
  - search


markdown_extensions:
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - toc:
      permalink: true
extra_css:
  - assets/stylesheets/luxury.css
  - assets/stylesheets/readability-v3.css
  - assets/stylesheets/lab-tiles.css
  - assets/stylesheets/course-sidebar.css
  - assets/stylesheets/course-term-help.css
extra_javascript:
  - assets/javascripts/course-sidebar.js
  - assets/javascripts/course-term-help.js
nav:
  - Course outline: index.md
  - Exam coverage: exam/coverage.md
  - Module 1 · Manage Users:
      - Overview: modules/manage-users.md
      - Lesson 1 · Read an Okta user record: modules/manage-users/01-read-an-okta-user-record.md
      - Lesson 2 · Create and activate a user: modules/manage-users/02-create-and-activate-a-user.md
      - Lesson 3 · Bring users into Okta through imports or first sign-in: modules/manage-users/03-import-users-and-first-sign-in.md
  - Module 2 · Foundations:
      - Lesson 1 · Your Okta org: week-01-foundations/lessons/01-your-okta-org.md
      - Lesson 2 · Users, profiles, and activation: week-01-foundations/lessons/02-users-profiles-and-activation.md
      - Lesson 3 · Groups and membership rules: week-01-foundations/lessons/03-groups-and-membership-rules.md
      - Lesson 4 · Application assignment and the End-User Dashboard: week-01-foundations/lessons/04-application-assignment-and-dashboard.md
      - Lesson 5 · System Log and access investigations: week-01-foundations/lessons/05-system-log-and-access-investigations.md
      - Module 2 capstone · Finance joiner and mover: week-01-foundations/labs/06-finance-joiner-and-mover.md
  - Module 3 · Universal Directory and lifecycle:
      - Lesson 1 · Universal Directory and profile attributes: week-02-directory-and-lifecycle/lessons/01-universal-directory-and-profile-attributes.md
      - Lesson 2 · Profile mappings: week-02-directory-and-lifecycle/lessons/02-profile-mappings.md
      - Lesson 3 · Suspend, deactivate, and restore a user: week-02-directory-and-lifecycle/lessons/03-user-account-lifecycle.md
      - Lesson 4 · Profile sourcing and source priority: week-02-directory-and-lifecycle/lessons/04-profile-sourcing-and-source-priority.md
      - Lesson 5 · Application provisioning: week-02-directory-and-lifecycle/lessons/05-application-provisioning.md
      - Lesson 6 · Group Push: week-02-directory-and-lifecycle/lessons/06-group-push.md
      - Lesson 7 · Okta Workflows for lifecycle management: week-02-directory-and-lifecycle/lessons/07-okta-workflows.md
      - Module 3 capstone · Manage a user from profile to offboarding: week-02-directory-and-lifecycle/labs/08-directory-and-lifecycle-capstone.md

  - Module 4 · SAML and attribute mappings:
      - Lesson 1 · SAML sign-in with Okta: week-03-saml-and-mappings/lessons/01-saml-sign-in.md
      - Lesson 2 · Custom SAML attributes and group assignment: week-03-saml-and-mappings/lessons/02-custom-saml-attributes-and-group-assignment.md
      - Lesson 3 · Troubleshoot SAML and choose an SSO method: week-03-saml-and-mappings/lessons/03-saml-troubleshooting-and-sso.md
      - Module 4 capstone · Deliver a custom SAML integration: week-03-saml-and-mappings/labs/04-custom-saml-integration-capstone.md

  - Module 5 · Active Directory and LDAP:
      - Lesson 1 · Connect Active Directory to Okta: week-04-ad-and-ldap/lessons/01-connect-active-directory.md
