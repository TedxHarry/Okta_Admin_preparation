name: Build course reader
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'mkdocs-material>=9.6,<10'
      - name: Collect the course pages
        run: |
          cp -R reader .site_docs
          for week in week-*; do cp -R "$week" .site_docs/; done
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
